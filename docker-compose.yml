version: "3.9"

services:
  sovascan-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sovascan-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sovascan.db
      - SECRET_KEY=change-me-in-production
      - DEBUG=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped
