id: BANK-001
name: RBI Cybersecurity Framework / PCI-DSS Violation
description: Storage of sensitive payment data (like CVV, clear-text PAN) or weak encryption in banking/financial context
severity: critical
category: banking-specific
pattern: "(cvv2?|card_security_code|pan_number|credit_card_number)\\s*[:=]\\s*[\"']?([0-9]{3,4}|[0-9]{13,19})[\"']?"
file_types: ["*.py", "*.java", "*.properties", "*.yml", "*.yaml", "*.json", "*.env", "*.conf"]
remediation: "Never store CVV/CSC values. Mask and encrypt Primary Account Numbers (PAN) in transit and at rest per RBI and PCI-DSS mandates."
references:
  - "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=11266"
tags: [banking, rbi, pci-dss, compliance]
enabled: true
