id: SOVA-DB-001
name: Default/Common Database Password Detected
description: Detected database configuration using default or easily guessable passwords
severity: critical
category: database
pattern: "(password|passwd|pwd)\\s*[:=]\\s*[\"']?(admin|root|password|123456|1234|postgres|mysql|sa|secret|pass|dbpass)[\"']?\\b"
file_types: ["*.py", "*.java", "*.properties", "*.yml", "*.yaml", "*.ini", "*.json", "*.env", "*.conf"]
remediation: "Change the database password to a strong, unique value. Do not hardcode passwords in configuration files; use secrets managers or environment variables."
references:
  - "https://cwe.mitre.org/data/definitions/259.html"
tags: [database, credential, vault]
enabled: true
