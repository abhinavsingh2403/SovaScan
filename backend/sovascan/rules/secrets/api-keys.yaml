id: SOVA-SECRET-001
name: Hardcoded API Key Detected
description: Hardcoded secrets (API keys, client secrets, JWT secrets) are exposed to anyone who has access to the codebase
severity: critical
category: secrets
pattern: "(?i)(api[-_]?key|client[-_]?secret|jwt[-_]?secret|github[-_]?token|aws[-_]?secret)\\s*[:=]\\s*[\"']([a-zA-Z0-9_\\-]{16,})[\"']"
file_types: ["*.py", "*.java", "*.properties", "*.yml", "*.yaml", "*.ini", "*.json", "*.env", "*.conf", "*.js", "*.ts"]
remediation: "Remove the key from the source code. Load it dynamically from environment variables or a secure key store (e.g. AWS Secrets Manager, HashiCorp Vault)."
references:
  - "https://cwe.mitre.org/data/definitions/798.html"
tags: [secrets, token, credential]
enabled: true
