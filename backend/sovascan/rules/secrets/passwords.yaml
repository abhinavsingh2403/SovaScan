id: SOVA-SECRET-002
name: Hardcoded Password in Code or Config
description: Hardcoded passwords in files can lead to unauthorized access if files are shared or committed to repositories
severity: critical
category: secrets
pattern: "(?i)(db_password|database_password|dbpass|db_pwd)\\s*[:=]\\s*[\"']([^\"']{4,})[\"']"
file_types: ["*.py", "*.java", "*.properties", "*.yml", "*.yaml", "*.ini", "*.json", "*.env", "*.conf"]
remediation: "Remove the password from code and load it from environment variables or a configuration server."
references:
  - "https://cwe.mitre.org/data/definitions/259.html"
tags: [secrets, credential, database]
enabled: true
