server {
    listen 443 ssl;
    server_name secure.banking.com;

    # Vulnerability: Insecure TLS Protocols (TLSv1 and TLSv1.1 enabled)
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # Vulnerability: Exposes Nginx server version tokens
    server_tokens on;

    location /api/v1 {
        # Vulnerability: Wildcard CORS allowed
        add_header 'Access-Control-Allow-Origin' '*';
        proxy_pass http://localhost:8000;
    }
}
